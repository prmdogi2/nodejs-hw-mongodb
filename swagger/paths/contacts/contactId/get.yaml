tags:
  - Contacts
summary: Tek bir kişiyi getir
operationId: getContactById
description: Belirtilen id'ye sahip kişinin detaylarını döndürür.
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
    description: Getirilecek kişinin MongoDB id'si
responses:
  '200':
    description: Başarılı - kişi bulundu
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: string
              example: success
            code:
              type: integer
              example: 200
            data:
              $ref: '../../../../swagger/components/schemas/contact.yaml#/Contact'
  '404':
    $ref: '../../../../swagger/components/responses/404.yaml'